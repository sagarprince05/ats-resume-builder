<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ATS Resume Builder tests</title>
<style>
  body { font: 13px/1.5 system-ui, sans-serif; margin: 0; display: grid; grid-template-columns: 420px 1fr; height: 100vh; }
  #log { overflow: auto; padding: 12px 16px; border-right: 1px solid #ddd; }
  #log div { padding: 3px 0; border-bottom: 1px solid #f0f0f0; white-space: pre-wrap; }
  .pass { color: #167a3d; } .fail { color: #b3261e; font-weight: 600; } .info { color: #666; }
  iframe { width: 100%; height: 100%; border: 0; }
  h1 { font-size: 15px; margin: 0 0 8px; }
</style>
</head>
<body>
<div id="log"><h1>Tests</h1></div>
<iframe id="app" src="about:blank"></iframe>
<script src="e2e.js"></script>
</body>
</html>
